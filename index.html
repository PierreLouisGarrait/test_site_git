<!DOCTYPE html>

<html lang="fr">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Test site Github Pages</title>
  <style>
    body { 
        font-family: sans-serif; 
        max-width: 700px; 
        margin: 2rem auto; 
        padding: 0 1rem; 
        line-height: 1.6; 
    }
    h1 { 
        color: "black"; 
        font-family: "Times New Roman", serif;
        font-style: bold;
        font-size: 250%;
        text-align: center;
    }
    .prenom {
        text-align: center;
        font-family: "Brush Script MT", "Segoe Script", cursive;
        font-size: 2rem;
        margin-top: -1rem;
    }
    .colonnes {
        display: flex;
        gap: 1.5rem;
        align-items: flex-start;
    }
    .colonnes .photo,
    .colonnes .texte {
        flex: 1;
    }
    .photo img {
        width: 100%;
        height: auto;
        max-width: 150px;
    }
    @media (max-width: 600px) {
        .colonnes { flex-direction: column; }
    }
  </style>
</head>

<body style="background-color: rgb(255, 245, 254);">

    <img src="images/image.png" alt="Image" width="400px" >

    <h1>Test site Gihub Pages</h1>
    <p class="prenom">Mon prénom</p>

    <div class="colonnes">
        <div class="photo">
            <img src="images/visage.png" alt="Photo du kinésithérapeute">
        </div>
        <div class="texte">
            <p>En deux mots</p>
        </div>
    </div>

    <h2>Horaires</h2>
    <p>Pas pour l'instant...</p>

    <h2>Contact</h2>
    <p>Pas pour l'instant...</p>
</body>

</html>
