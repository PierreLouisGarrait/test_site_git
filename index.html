<!DOCTYPE html>

<html lang="fr">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Test site Github Pages</title>
  <link href="https://fonts.googleapis.com/css2?family=Shrikhand&display=swap" rel="stylesheet">
  <link href="https://fonts.googleapis.com/css2?family=Abril+Fatface&display=swap" rel="stylesheet">
  <style>
    :root {
        --couleur_titre: rgb(78, 85, 83);
        --couleur_sous_titre: rgb(78, 85, 83);
        --couleur_arriere_plan: rgb(216, 228, 224) ;
        --couleur_bandeau: rgb(180, 200, 194) ;
        --rose: rgb(255, 230, 240);
        --noir: black;
    }
    body { 
        font-family: sans-serif; 
        margin: 0;
        padding: 0;
        line-height: 1.6;
        background-color: white;
    }
    .conteneur {
        max-width: 700px;
        margin: 0rem auto 2rem auto;
        padding: 1rem 1rem 0rem 1rem;
        border-radius: 0 0 15px 15px;
        background-color: rgb(216, 228, 224);
    }
    .conteneur_sans_marges {
        max-width: 700px;
        margin: 2rem auto 0 auto;
        padding: 1rem 1rem 0 1rem;
        background-color: rgb(216, 228, 224);
        border-radius: 15px 15px 0 0;
    }
    h1 { 
        color: var(--couleur_titre); 
        font-family: "Abril Fatface", cursive;
        font-weight: bold;
        text-align: center;
        margin-top: 0;
        width: 100%;
        margin-left: auto;
        margin-right: auto;
        font-size: clamp(1.5rem, 8vw, 4rem);
    }
    h2 {
        font-family: "Abril Fatface", cursive;
        font-style: italic;
        /* font-size: 200%; */
        color: var(--couleur_sous_titre);
        width: 100%;
        text-align: left;
        margin-left: 2rem;
        font-size: clamp(1rem, 6vw, 2.5rem) ; /* (minimum, préféré, maximum) */
    }
    .prenom {
        text-align: center;
        font-family: "Abril Fatface", cursive;
        font-style: italic;
        margin-top: -1rem;
        width: 100%;
        font-size: clamp(1.5rem, 8vw, 4rem);
        text-shadow:
            -2px -2px 0 white,
            2px -2px 0 white,
            -2px  2px 0 white,
            2px  2px 0 white;
        color: var(--couleur_bandeau);
    }
    .colonnes {
        display: flex;
        gap: 1.5rem;
        align-items: flex-start;
    }
    .colonnes .photo {
        flex: 0 0 30%;
    }
    .colonnes .texte {
        flex: 0 0 70%;
    }
    .photo img {
        width: 100%;
        /* max-width: 250px; */
        height: auto;
        display: block;
    }
    .image-haut {
        width: 100%;
        display: block;
        margin: 0;
    }
    .bandeau-colonnes {
        width: 90%;
        margin: 0 auto;
        background-color: rgb(180, 200, 194);
        padding: 1rem;
        border-radius: 10px;
    }
    .tableau-horaires {
        width: 70%;
        border-collapse: collapse;
        margin: 0 auto ;

    }
    .tableau-horaires td {
        padding: 0.5rem 0;
        vertical-align: middle;
    }
    .tableau-horaires td:first-child {
        text-align: left;
        border-left: 2px solid var(--couleur_bandeau);
        padding-left: 1rem;
    }
    .tableau-horaires td:last-child {
        text-align: right;
    }
    .bouton {
        display: inline-block;
        background-color: rgb(180, 200, 194);
        color: black;
        text-decoration: none;
        padding: 0.4rem 1rem;
        border-radius: 6px;
    }
    /* @media (max-width: 600px) {
        .colonnes { flex-direction: column; }
    } */
  </style>
</head>

<body>
    <div class="conteneur_sans_marges">
        <img src="images/image.png" alt="Image" class="image-haut">
    </div>

    <div class="conteneur">

        <div class="colonnes bandeau-colonnes">
            <div class="photo">
                <img src="images/visage.png" alt="Photo du kinésithérapeute">
            </div>
            <div class="texte">
                <p>En deux mots</p>
            </div>
        </div>

        <h2>Lieux et jours d'exercice</h2>
        <table class="tableau-horaires">

            </tr>

                <td><a href="https://www.google.com" class="bouton">Voir</a></td>
            </tr>

                <td><a href="https://www.google.com" class="bouton">Voir</a></td>

        </table>

        <h2>Prise de contact</h2>

    </div>

</body>

</html>
